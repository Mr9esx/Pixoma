  <style>
    #pixoma-loader {
      transform-box: view-box;
      transform-origin: 50% 86%;
      animation: pixoma-hop 1s steps(1, end) infinite;
    }
    @keyframes pixoma-hop {
      0%, 100% { transform: translateY(4px) scale(1, 1); }
      12% { transform: translateY(9px) scale(1.06, .94); }
      28% { transform: translateY(-9px) scale(.96, 1.04); }
      45% { transform: translateY(-14px) scale(1, 1); }
      62% { transform: translateY(-6px) scale(.98, 1.02); }
      82% { transform: translateY(9px) scale(1.07, .93); }
      92% { transform: translateY(6px) scale(1.02, .98); }
    }
  </style>
