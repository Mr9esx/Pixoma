<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixoma · 创作 Studio 高保真原型</title>
  <style>
    :root {
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
      --card: oklch(1 0 0);
      --muted: oklch(0.97 0 0);
      --muted-foreground: oklch(0.52 0 0);
      --border: oklch(0.91 0 0);
      --input: oklch(0.89 0 0);
      --primary: oklch(0.205 0 0);
      --primary-foreground: oklch(0.985 0 0);
      --brand: oklch(0.646 0.222 41.116);
      --brand-soft: color-mix(in oklch, var(--brand) 11%, var(--background));
      --success: oklch(0.58 0.14 164);
      --warning: oklch(0.75 0.16 76);
      --danger: oklch(0.58 0.2 27);
      --radius: 10px;
      --shadow: 0 16px 48px color-mix(in oklch, var(--foreground) 15%, transparent);
      --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; color: var(--foreground); background: var(--background); font: 14px/1.5 var(--font); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid color-mix(in oklch, var(--brand) 55%, transparent); outline-offset: 2px; }
    .hidden { display: none !important; }
    .grow { flex: 1; min-width: 0; }
    .row { display: flex; align-items: center; }
    .column { display: flex; flex-direction: column; }
    .gap-6 { gap: 6px; }
    .gap-8 { gap: 8px; }
    .gap-12 { gap: 12px; }
    .muted { color: var(--muted-foreground); }
    .mono { font-family: var(--mono); }
    .divider { height: 1px; background: var(--border); }

    .btn { min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--background); white-space: nowrap; }
    .btn:hover { background: var(--muted); }
    .btn-primary { color: var(--primary-foreground); border-color: var(--primary); background: var(--primary); }
    .btn-primary:hover { background: color-mix(in oklch, var(--primary) 88%, white); }
    .btn-brand { color: white; border-color: var(--brand); background: var(--brand); }
    .btn-brand:hover { background: color-mix(in oklch, var(--brand) 88%, black); }
    .btn-ghost { border-color: transparent; background: transparent; }
    .btn-sm { min-height: 30px; padding: 4px 9px; font-size: 12px; }
    .btn-icon { width: 36px; padding: 0; }
    .btn-danger { color: var(--danger); }
    .badge { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--background); font-size: 11px; }
    .badge-brand { color: color-mix(in oklch, var(--brand) 76%, black); border-color: color-mix(in oklch, var(--brand) 35%, var(--border)); background: var(--brand-soft); }
    .badge-warn { border-color: color-mix(in oklch, var(--warning) 42%, var(--border)); background: color-mix(in oklch, var(--warning) 10%, var(--background)); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-foreground); }
    .dot.running { background: var(--brand); animation: pulse 1.2s ease-in-out infinite; }
    .dot.done { background: var(--success); }
    .dot.warn { background: var(--warning); }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }

    /* Studio 壳层 */
    #studio { height: 100%; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
    .studio-side { min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 62%, var(--background)); }
    .side-head { padding: 12px; border-bottom: 1px solid var(--border); }
    .studio-brand { height: 38px; display: flex; align-items: center; gap: 10px; font-weight: 680; }
    .brand-mark { width: 24px; height: 24px; display: grid; place-items: center; color: white; border-radius: 7px; background: var(--foreground); font-size: 11px; font-weight: 800; }
    .side-actions { display: grid; gap: 7px; margin-top: 10px; }
    .side-actions .btn { width: 100%; justify-content: flex-start; }
    .side-actions .active { background: var(--background); box-shadow: inset 0 0 0 1px var(--border); }
    .side-search { padding: 12px 12px 5px; }
    .field { width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid var(--input); border-radius: 8px; background: var(--background); }
    .history-label { padding: 12px 14px 6px; color: var(--muted-foreground); font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    .session-list { overflow: auto; padding: 0 8px 14px; }
    .session-item { width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
    .session-item:hover, .session-item.active { background: var(--background); }
    .session-name { overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .session-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: var(--muted-foreground); font-size: 11px; }
    .user-card { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 12px; border-top: 1px solid var(--border); }
    .avatar { width: 30px; height: 30px; display: grid; place-items: center; color: white; border-radius: 50%; background: var(--primary); font-size: 11px; font-weight: 700; }
    .workspace { min-width: 0; min-height: 0; position: relative; }

    /* 对话 + 工作台 */
    #sessionView { height: 100%; display: grid; grid-template-columns: minmax(390px, .9fr) minmax(480px, 1.1fr); }
    .chat { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
    .panel-head { height: 64px; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--border); background: var(--background); }
    .panel-title { overflow: hidden; font-size: 15px; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
    .panel-subtitle { display: flex; align-items: center; gap: 5px; color: var(--muted-foreground); font-size: 11px; }
    .messages { flex: 1; overflow: auto; padding: 24px max(20px, 6%); scroll-behavior: smooth; }
    .message { max-width: 760px; margin: 0 auto 22px; }
    .message-user { display: flex; justify-content: flex-end; }
    .user-bubble { max-width: 84%; padding: 10px 13px; color: var(--primary-foreground); border-radius: 14px 14px 3px 14px; background: var(--primary); }
    .assistant-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 680; }
    .assistant-avatar { width: 24px; height: 24px; display: grid; place-items: center; color: var(--brand); border-radius: 7px; background: var(--brand-soft); font-weight: 800; }
    .assistant-copy { line-height: 1.7; }
    .reasoning { margin: 10px 0; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklch, var(--muted) 56%, var(--background)); }
    .reasoning summary { padding: 9px 11px; cursor: pointer; color: var(--muted-foreground); font-size: 12px; }
    .reasoning p { margin: 0; padding: 0 11px 11px; color: var(--muted-foreground); font-size: 12px; }
    .inline-card { margin-top: 12px; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
    .inline-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
    .inline-body { padding: 11px 12px; border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; }
    .approval-card { border-color: color-mix(in oklch, var(--warning) 48%, var(--border)); }
    .approval-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .asset-file { display: flex; align-items: center; gap: 10px; }
    .file-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; background: var(--muted); font: 700 10px var(--mono); }

    .composer-shell { flex: 0 0 auto; padding: 10px max(16px, 6%) 16px; border-top: 1px solid var(--border); }
    .context-pills { max-width: 760px; margin: 0 auto 7px; display: flex; gap: 6px; overflow-x: auto; }
    .context-pill { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 11px; }
    .composer { max-width: 760px; margin: 0 auto; padding: 9px; border: 1px solid var(--input); border-radius: 12px; background: var(--background); box-shadow: 0 1px 4px color-mix(in oklch, var(--foreground) 5%, transparent); }
    .composer textarea { width: 100%; min-height: 52px; max-height: 130px; resize: vertical; padding: 2px 3px; border: 0; outline: 0; background: transparent; }
    .composer-foot { display: flex; align-items: center; gap: 5px; }
    .composer-select { min-height: 30px; max-width: 145px; padding: 4px 26px 4px 8px; border: 0; border-radius: 7px; background: var(--muted); font-size: 11px; }
    .save-hint { margin-left: auto; color: var(--muted-foreground); font-size: 10px; }

    .workbench { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: color-mix(in oklch, var(--muted) 48%, var(--background)); }
    .workbench-head { height: 64px; flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--background); }
    .tabs { height: 100%; display: flex; align-items: flex-end; gap: 18px; }
    .tab { height: 100%; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; color: var(--muted-foreground); background: transparent; }
    .tab.active { color: var(--foreground); border-bottom-color: var(--foreground); font-weight: 650; }
    .workbench-actions { display: flex; gap: 5px; padding-bottom: 13px; }
    .workbench-body { flex: 1; min-height: 0; position: relative; }
    .flow-pane { position: absolute; inset: 0; overflow: auto; background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 18px 18px; }
    .flow-intro { margin: 18px 18px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .flow-intro h3 { margin: 0; font-size: 14px; }
    .flow-intro p { margin: 3px 0 0; color: var(--muted-foreground); font-size: 11px; }
    .stage-road { min-width: 920px; display: flex; align-items: flex-start; gap: 28px; padding: 24px 30px 80px; }
    .stage { width: 272px; flex: 0 0 auto; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: color-mix(in oklch, var(--background) 94%, transparent); box-shadow: 0 5px 18px color-mix(in oklch, var(--foreground) 6%, transparent); }
    .stage.dragging, .road-node.dragging { opacity: .45; }
    .stage.drag-over, .road-node.drag-over { border-color: var(--brand); }
    .stage-head { display: flex; align-items: flex-start; gap: 9px; padding: 3px 3px 10px; cursor: grab; }
    .stage-index { color: var(--brand); font: 700 12px var(--mono); }
    .stage-title { font-size: 13px; font-weight: 700; }
    .stage-desc { margin-top: 2px; color: var(--muted-foreground); font-size: 10px; }
    .stage-nodes { display: grid; gap: 8px; }
    .road-node { width: 100%; position: relative; padding: 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--background); text-align: left; }
    .road-node:hover, .road-node.selected { border-color: color-mix(in oklch, var(--foreground) 55%, var(--border)); }
    .road-node:not(:last-child)::after { content: "↓"; position: absolute; left: 50%; bottom: -18px; z-index: 3; color: var(--muted-foreground); font-size: 11px; }
    .node-kicker { color: var(--muted-foreground); font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .node-name { margin-top: 4px; font-size: 12px; font-weight: 650; }
    .node-meta { margin-top: 7px; display: flex; justify-content: space-between; color: var(--muted-foreground); font-size: 10px; }
    .node-thumb { height: 70px; margin-top: 8px; display: grid; place-items: center; overflow: hidden; border-radius: 7px; background: linear-gradient(145deg, var(--muted), var(--brand-soft)); color: var(--muted-foreground); font-size: 10px; }
    .flow-arrow { width: 28px; flex: 0 0 auto; align-self: center; color: var(--muted-foreground); text-align: center; }
    .flow-note { position: sticky; left: 18px; bottom: 16px; width: max-content; max-width: 540px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: color-mix(in oklch, var(--background) 92%, transparent); color: var(--muted-foreground); font-size: 10px; backdrop-filter: blur(8px); }
    .asset-pane { position: absolute; inset: 0; overflow: auto; padding: 18px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .section-title { font-size: 12px; font-weight: 680; }
    .asset-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .asset-card { min-width: 0; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--background); text-align: left; }
    .asset-card:hover { border-color: color-mix(in oklch, var(--foreground) 38%, var(--border)); }
    .asset-preview { height: 104px; margin-bottom: 9px; display: grid; place-items: center; overflow: hidden; border-radius: 7px; background: var(--muted); color: var(--muted-foreground); font-size: 10px; }
    .comic-grid { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 4px; background: var(--background); }
    .comic-cell { display: grid; place-items: center; border: 1px solid var(--border); background: linear-gradient(145deg, var(--muted), var(--brand-soft)); }
    .asset-name { overflow: hidden; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .asset-meta { margin-top: 3px; color: var(--muted-foreground); font-size: 10px; }

    /* 抽屉 */
    .drawer { position: absolute; z-index: 20; top: 0; right: 0; bottom: 0; width: min(380px, 86%); display: flex; flex-direction: column; border-left: 1px solid var(--border); background: var(--background); box-shadow: var(--shadow); }
    .drawer-head { height: 58px; flex: 0 0 auto; display: flex; align-items: center; gap: 9px; padding: 0 14px; border-bottom: 1px solid var(--border); }
    .drawer-body { overflow: auto; padding: 16px; }
    .kv { display: grid; grid-template-columns: 72px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
    .code-box { margin-top: 12px; padding: 10px; border-radius: 8px; background: var(--muted); font: 11px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
    .trace-item { position: relative; padding: 0 0 18px 22px; }
    .trace-item::before { content: ""; position: absolute; left: 5px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
    .trace-item:not(:last-child)::after { content: ""; position: absolute; left: 8px; top: 14px; bottom: 2px; width: 1px; background: var(--border); }
    .trace-title { font-size: 12px; font-weight: 650; }
    .trace-meta { margin-top: 3px; color: var(--muted-foreground); font-size: 10px; }

    /* Studio 内资产库 */
    #libraryView { height: 100%; overflow: auto; background: var(--background); }
    .library-wrap { max-width: 1440px; margin: 0 auto; padding: 28px 32px 72px; }
    .page-title { margin: 0; font-size: 24px; font-weight: 720; letter-spacing: -.03em; }
    .page-subtitle { margin-top: 4px; color: var(--muted-foreground); }
    .toolbar { display: flex; align-items: center; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
    .toolbar .field { width: min(360px, 100%); }
    .library-layout { display: grid; grid-template-columns: 210px 1fr; gap: 20px; margin-top: 20px; }
    .folders { align-self: start; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); }
    .folder { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px; border: 0; border-radius: 7px; background: transparent; text-align: left; }
    .folder:hover, .folder.active { background: var(--muted); }
    .folder-count { margin-left: auto; color: var(--muted-foreground); font-size: 11px; }
    .library-grid { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 12px; }
    .library-card { overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: var(--background); text-align: left; }
    .library-card:hover { border-color: color-mix(in oklch, var(--foreground) 38%, var(--border)); }
    .library-card .asset-preview { height: 150px; margin: 0; border-radius: 0; }
    .library-card-info { padding: 12px; }
    .progress-strip { position: fixed; z-index: 30; left: 236px; right: 0; bottom: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-top: 1px solid var(--border); background: color-mix(in oklch, var(--background) 94%, transparent); backdrop-filter: blur(10px); }
    .progress-line { width: 220px; height: 5px; overflow: hidden; border-radius: 999px; background: var(--muted); }
    .progress-line i { display: block; width: 0; height: 100%; background: var(--brand); transition: width .35s ease; }

    /* 后台与 AI 设置 */
    #admin { height: 100%; display: grid; grid-template-columns: 224px minmax(0, 1fr); }
    .admin-side { padding: 14px 10px; border-right: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 58%, var(--background)); }
    .admin-logo { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 10px; font-weight: 720; }
    .menu-label { padding: 18px 10px 6px; color: var(--muted-foreground); font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    .menu-item { width: 100%; height: 38px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
    .menu-item:hover, .menu-item.active { background: var(--background); }
    .admin-main { min-width: 0; overflow: auto; }
    .admin-head { height: 64px; display: flex; align-items: center; padding: 0 28px; border-bottom: 1px solid var(--border); }
    .admin-content { max-width: 1240px; margin: 0 auto; padding: 28px 32px 60px; }
    .setting-tabs { display: flex; gap: 4px; margin-top: 22px; padding: 4px; border-radius: 10px; background: var(--muted); width: max-content; }
    .setting-tab { min-height: 32px; padding: 5px 11px; border: 0; border-radius: 7px; color: var(--muted-foreground); background: transparent; }
    .setting-tab.active { color: var(--foreground); background: var(--background); box-shadow: 0 1px 3px color-mix(in oklch, var(--foreground) 8%, transparent); }
    .settings-grid { display: grid; gap: 12px; margin-top: 20px; }
    .setting-card { padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
    .setting-card h3 { margin: 0; font-size: 14px; }
    .setting-card p { margin: 4px 0 0; color: var(--muted-foreground); font-size: 12px; }
    .setting-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr auto; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: 0; }
    .switch { width: 36px; height: 20px; position: relative; border: 0; border-radius: 999px; background: var(--foreground); }
    .switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; border-radius: 50%; background: white; }
    .switch.off { background: var(--border); }
    .switch.off::after { left: 3px; right: auto; }

    /* 浮层 */
    dialog { width: min(620px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--background); box-shadow: var(--shadow); }
    dialog::backdrop { background: color-mix(in oklch, var(--foreground) 28%, transparent); }
    .modal-head { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); }
    .modal-body { padding: 16px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
    .form-label { display: block; margin: 12px 0 5px; font-size: 12px; font-weight: 650; }
    .textarea { width: 100%; min-height: 120px; resize: vertical; padding: 10px; border: 1px solid var(--input); border-radius: 8px; background: var(--background); }
    .toast-stack { position: fixed; z-index: 60; right: 18px; bottom: 18px; display: grid; gap: 8px; }
    .toast { min-width: 260px; max-width: 360px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--background); box-shadow: var(--shadow); animation: toast-in .18s ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } }

    @media (max-width: 1150px) {
      #sessionView { grid-template-columns: minmax(360px, .95fr) minmax(420px, 1.05fr); }
      .library-grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
    }
    @media (max-width: 900px) {
      #studio { grid-template-columns: 76px minmax(0, 1fr); }
      .studio-side { overflow: hidden; }
      .studio-brand span, .side-actions .btn span, .side-search, .history-label, .session-list, .user-card .grow { display: none; }
      .side-actions .btn { justify-content: center; }
      .progress-strip { left: 76px; }
      #sessionView { display: block; }
      .chat { height: 100%; }
      .workbench { position: absolute; z-index: 12; inset: 0; }
      .workbench.mobile-hidden { display: none; }
      .library-layout { grid-template-columns: 1fr; }
      .folders { display: flex; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div id="studio">
    <aside class="studio-side">
      <div class="side-head">
        <div class="studio-brand"><span class="brand-mark">PX</span><span>创作 Studio</span></div>
        <div class="side-actions">
          <button class="btn btn-ghost" data-action="back-admin">← <span>返回后台</span></button>
          <button class="btn btn-primary" data-action="new-session">＋ <span>新对话</span></button>
          <button class="btn" id="libraryButton" data-action="show-library">▦ <span>资产库</span></button>
        </div>
      </div>
      <div class="side-search"><input class="field" id="sessionSearch" placeholder="搜索对话" /></div>
      <div class="history-label">最近对话</div>
      <div class="session-list" id="sessionList"></div>

  <script>
    const STORAGE_KEY = "pixoma-studio-prototype-v4";
    const initialState = {

      activeTab: "flow",

      permission: "ask",
      model: "Claude 4 Sonnet",
      selectedNode: null,

      activeFolder: "全部资产",
      sessions: [
        { id: "comic", title: "雨夜侦探漫画分镜创作", status: "等待批准", active: true },
        { id: "poster", title: "秋季咖啡海报视觉探索", status: "已完成" },
        { id: "video", title: "产品发布短片脚本", status: "后台运行" }
      ],
      messages: [
        { role: "user", text: "我想画一篇雨夜侦探漫画。先帮我构思故事和角色，再生成分镜图。" },
        { role: "assistant", text: "我会先把故事与人物关系整理成可复用的文本资产，再建立角色三视图，最后调用分镜工作流。这样后续换模型或重做镜头时，前面的资产都能继续复用。", reasoning: "已识别为多阶段创作任务。当前 Session 已有漫画参考资产；角色一致性应先于分镜生成。", asset: "雨夜来客·故事设定.md" },
        { role: "assistant", text: "故事设定已生成，并加入右侧资产 Road。下一步会调用生图模型生成角色三视图。当前权限为“请求批准”，需要你确认。", approval: true }
      ],
      assets: [
        { id: "a1", name: "雨夜来客·故事设定.md", type: "Markdown", source: "Agent 创建", version: 1, saved: false },
        { id: "a2", name: "林墨·角色三视图.png", type: "图片", source: "生图模型", version: 2, saved: false },
        { id: "a3", name: "第一章·分镜脚本.md", type: "Markdown", source: "分镜工作流", version: 1, saved: true },
        { id: "a4", name: "第一章·六格分镜.png", type: "图片", source: "分镜工作流", version: 1, saved: false }
      ],
      libraryAssets: [
        { id: "l1", name: "第一章·分镜脚本.md", type: "Markdown", source: "雨夜侦探漫画分镜创作", folder: "漫画项目" },
        { id: "l2", name: "小满·角色设定.png", type: "图片", source: "秋日物语角色设定", folder: "角色设定" },
        { id: "l3", name: "咖啡馆色彩参考.jpg", type: "图片", source: "用户上传", folder: "参考素材" },
        { id: "l4", name: "短片旁白终稿.md", type: "Markdown", source: "产品发布短片脚本", folder: "漫画项目" }
      ],
      stages: [
        { id: "s1", title: "立住角色", desc: "锁定角色外观与背景", nodes: [
          { id: "n1", type: "计划", name: "定义主角林墨", meta: "对话生成" },
          { id: "n2", type: "资产", name: "故事设定.md", meta: "v1 · Markdown" },
          { id: "n3", type: "操作", name: "生成角色三视图", meta: "等待批准" },
          { id: "n4", type: "资产", name: "角色三视图.png", meta: "v2 · 图片", thumb: true }
        ]},
        { id: "s2", title: "排好分镜", desc: "按章节铺开镜头", nodes: [
          { id: "n5", type: "计划", name: "拆解第一章节奏", meta: "Agent 计划" },
          { id: "n6", type: "操作", name: "运行分镜工作流", meta: "待执行" },
          { id: "n7", type: "资产", name: "分镜脚本.md", meta: "v1 · Markdown" }
        ]},
        { id: "s3", title: "选模型出稿", desc: "逐格生成并迭代", nodes: [
          { id: "n8", type: "计划", name: "确定黑色电影风格", meta: "用户可编辑" },
          { id: "n9", type: "操作", name: "生成六格分镜图", meta: "待执行" },
          { id: "n10", type: "资产", name: "六格分镜.png", meta: "v1 · 图片", thumb: true }
        ]}
      ]
    };

    let state = loadState();
    let drag = null;
    let runTimer = null;

    function loadState() {
      try { return { ...structuredClone(initialState), ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") }; }
      catch { return structuredClone(initialState); }
    }
    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function escapeHTML(value) { return String(value).replace(/[&<>'"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" }[c])); }
    function toast(text) {
      const el = document.createElement("div"); el.className = "toast"; el.textContent = text;
      document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 2600);
    }

    function render() {
      const inAdmin = state.view === "admin" || state.view === "settings";
      document.getElementById("studio").classList.toggle("hidden", inAdmin);
      document.getElementById("admin").classList.toggle("hidden", !inAdmin);
      document.getElementById("sessionView").classList.toggle("hidden", state.view !== "session");
      document.getElementById("libraryView").classList.toggle("hidden", state.view !== "library");
      document.getElementById("libraryButton").classList.toggle("active", state.view === "library");
      document.getElementById("modelSelect").value = state.model;
      document.getElementById("permissionSelect").value = state.permission;
      const activeSession = state.sessions.find(s => s.active) || state.sessions[0];
      document.getElementById("sessionTitle").textContent = activeSession?.title || "新对话";
      renderRun(); renderSessions(); renderMessages(); renderContext(); renderFlow(); renderAssets(); renderLibrary();
      if (inAdmin) renderAdmin();
      saveState();
    }

    function renderSessions() {
      const query = (document.getElementById("sessionSearch").value || "").toLowerCase();
      document.getElementById("sessionList").innerHTML = state.sessions.filter(s => s.title.toLowerCase().includes(query)).map(s => `
        <button class="session-item ${s.active && state.view === "session" ? "active" : ""}" data-session="${s.id}">
          <div class="session-name">${escapeHTML(s.title)}</div><div class="session-meta"><span class="dot ${s.status === "后台运行" ? "running" : s.status === "已完成" ? "done" : "warn"}"></span>${s.status}</div>
        </button>`).join("");
    }

    function renderMessages() {
      document.getElementById("messages").innerHTML = state.messages.map((m, index) => m.role === "user" ? `
        <div class="message message-user"><div class="user-bubble">${escapeHTML(m.text)}</div></div>` : `
        <div class="message"><div class="assistant-head"><span class="assistant-avatar">✦</span>Pixoma Agent</div><div class="assistant-copy">${escapeHTML(m.text)}</div>
          ${m.reasoning ? `<details class="reasoning"><summary>思考过程 · 已折叠</summary><p>${escapeHTML(m.reasoning)}</p></details>` : ""}
          ${m.asset ? `<div class="inline-card"><div class="inline-head asset-file"><span class="file-mark">MD</span><div class="grow"><strong>${escapeHTML(m.asset)}</strong><div class="muted" style="font-size:11px">Session 资产 · v1</div></div><button class="btn btn-sm" data-action="open-asset" data-asset="a1">查看</button></div></div>` : ""}
          ${m.approval && state.run.status === "approval" ? `<div class="inline-card approval-card"><div class="inline-head"><span class="dot warn"></span><strong>需要批准：调用生图模型</strong></div><div class="inline-body">将使用故事设定中的角色描述生成三视图，预计产生 1 个图片资产。<div class="approval-actions"><button class="btn btn-primary btn-sm" data-action="approve">批准并继续</button><button class="btn btn-sm" data-action="reject">拒绝</button><button class="btn btn-sm" data-action="open-trace">查看详情</button></div></div></div>` : ""}
          ${m.done ? `<div class="inline-card"><div class="inline-head"><span class="dot done"></span><strong>分镜工作流已完成</strong><span class="badge" style="margin-left:auto">4 个资产</span></div><div class="inline-body">结果已加入资产 Road。你可以继续调整节点顺序、换模型重做，或把选中的资产保存到资产库。</div></div>` : ""}
        </div>`).join("");
    }

    function renderContext() {
      document.getElementById("contextPills").innerHTML = `<span class="context-pill">▧ 故事设定.md</span><span class="context-pill">▧ 角色三视图.png</span><span class="context-pill badge-brand">Session 资产索引已注入</span>`;
    }

    function renderFlow() {
      document.getElementById("stageRoad").innerHTML = state.stages.map((stage, stageIndex) => `
        <section class="stage" draggable="true" data-stage="${stage.id}">
          <div class="stage-head"><span class="stage-index">${String(stageIndex + 1).padStart(2, "0")}</span><div class="grow"><div class="stage-title">${escapeHTML(stage.title)}</div><div class="stage-desc">${escapeHTML(stage.desc)}</div></div><span class="muted">⠿</span></div>
          <div class="stage-nodes">${stage.nodes.map(node => `
            <button class="road-node ${state.selectedNode === node.id ? "selected" : ""}" draggable="true" data-node="${node.id}" data-stage-parent="${stage.id}">
              <div class="node-kicker">${escapeHTML(node.type)}</div><div class="node-name">${escapeHTML(node.name)}</div>${node.thumb ? `<div class="node-thumb">${node.name.includes("六格") ? "▦ 六格分镜预览" : "人物正面 · 侧面 · 背面"}</div>` : ""}<div class="node-meta"><span>${escapeHTML(node.meta)}</span><span>•••</span></div>
            </button>`).join("")}</div>
        </section>`).join(`<div class="flow-arrow">→</div>`);
      bindDragEvents();
    }

    function bindDragEvents() {
      document.querySelectorAll("[draggable='true']").forEach(el => {
        el.addEventListener("dragstart", e => {
          drag = el.dataset.node ? { kind: "node", id: el.dataset.node, stageId: el.dataset.stageParent } : { kind: "stage", id: el.dataset.stage };
          el.classList.add("dragging"); e.stopPropagation();
        });
        el.addEventListener("dragend", () => { el.classList.remove("dragging"); document.querySelectorAll(".drag-over").forEach(x => x.classList.remove("drag-over")); });
        el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("drag-over"); e.stopPropagation(); });
        el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
        el.addEventListener("drop", e => { e.preventDefault(); e.stopPropagation(); handleDrop(el); });
      });
    }

    function handleDrop(target) {
      if (!drag) return;
      if (drag.kind === "stage" && target.dataset.stage && drag.id !== target.dataset.stage) {
        const from = state.stages.findIndex(s => s.id === drag.id); const to = state.stages.findIndex(s => s.id === target.dataset.stage);
        state.stages.splice(to, 0, state.stages.splice(from, 1)[0]); toast("阶段顺序已更新");
      }
      if (drag.kind === "node" && (target.dataset.node || target.dataset.stage)) {
        const fromStage = state.stages.find(s => s.id === drag.stageId); const nodeIndex = fromStage.nodes.findIndex(n => n.id === drag.id); const node = fromStage.nodes.splice(nodeIndex, 1)[0];
        const targetStageId = target.dataset.stageParent || target.dataset.stage; const toStage = state.stages.find(s => s.id === targetStageId);
        const targetIndex = target.dataset.node ? toStage.nodes.findIndex(n => n.id === target.dataset.node) : toStage.nodes.length;
        toStage.nodes.splice(Math.max(0, targetIndex), 0, node); toast("节点位置已更新");
      }
      drag = null; render();
    }

    function renderAssets() {
      document.getElementById("assetCount").textContent = state.assets.length;
      document.getElementById("assetPane").innerHTML = `<div class="section-head"><div><div class="section-title">本次对话的资产</div><div class="muted" style="font-size:11px">资产属于 Session；保存后会在资产库建立引用。</div></div><button class="btn btn-sm" data-action="create-asset">＋ 创建</button></div><div class="asset-grid">${state.assets.map(a => `
        <button class="asset-card" data-action="open-asset" data-asset="${a.id}"><div class="asset-preview">${a.type === "图片" ? `<div class="comic-grid"><span class="comic-cell">1</span><span class="comic-cell">2</span><span class="comic-cell">3</span><span class="comic-cell">4</span></div>` : `<span class="file-mark">MD</span>`}</div><div class="asset-name">${escapeHTML(a.name)}</div><div class="asset-meta">${a.source} · v${a.version}${a.saved ? " · 已存资产库" : ""}</div></button>`).join("")}</div>`;
      document.getElementById("flowPane").classList.toggle("hidden", state.activeTab !== "flow");
      document.getElementById("assetPane").classList.toggle("hidden", state.activeTab !== "assets");

    }

    function renderLibrary() {
      document.getElementById("folderList").innerHTML = state.folders.map(f => `<button class="folder ${state.activeFolder === f ? "active" : ""}" data-folder="${escapeHTML(f)}">▱ ${escapeHTML(f)}<span class="folder-count">${f === "全部资产" ? state.libraryAssets.length : state.libraryAssets.filter(a => a.folder === f).length}</span></button>`).join("");
      const query = (document.getElementById("assetSearch").value || "").toLowerCase();
      const list = state.libraryAssets.filter(a => (state.activeFolder === "全部资产" || a.folder === state.activeFolder) && `${a.name}${a.type}${a.source}`.toLowerCase().includes(query));
      document.getElementById("libraryGrid").innerHTML = list.map(a => `<button class="library-card" data-library-asset="${a.id}"><div class="asset-preview">${a.type === "图片" ? `<div class="comic-grid"><span class="comic-cell">A</span><span class="comic-cell">B</span><span class="comic-cell">C</span><span class="comic-cell">D</span></div>` : `<span class="file-mark">MD</span>`}</div><div class="library-card-info"><div class="asset-name">${escapeHTML(a.name)}</div><div class="asset-meta">${escapeHTML(a.type)} · ${escapeHTML(a.source)}</div><div class="badge" style="margin-top:8px">${escapeHTML(a.folder)}</div></div></button>`).join("") || `<div class="muted">这个文件夹还没有资产。</div>`;
    }

    function renderRun() {
      const statusMap = { approval: ["warn", "等待批准 · 自动保存"], running: ["running", `后台运行 · ${state.run.progress}%`], done: ["done", "已完成 · 自动保存"], idle: ["", "已自动保存"] };
      const [dot, label] = statusMap[state.run.status] || statusMap.idle;
      document.getElementById("runDot").className = `dot ${dot}`; document.getElementById("runLabel").textContent = label;
      const showStrip = state.run.status === "running" && state.view !== "session";
      document.getElementById("progressStrip").classList.toggle("hidden", !showStrip);
      document.getElementById("progressBar").style.width = `${state.run.progress}%`; document.getElementById("progressText").textContent = `后台生成中 · ${state.run.progress}%`;
      state.sessions[0].status = state.run.status === "running" ? "后台运行" : state.run.status === "done" ? "已完成" : state.run.status === "approval" ? "等待批准" : "已保存";
    }

    function renderAdmin() {
      const content = document.getElementById("adminContent");
      if (state.view === "admin") {
        document.getElementById("adminHeader").textContent = "Pixoma 后台";

        return;
      }
      document.getElementById("adminHeader").textContent = "AI 设置";
      const tab = state.settingsTab || "models";
      content.innerHTML = `<div class="row"><div class="grow"><h1 class="page-title">AI 设置</h1><div class="page-subtitle">Studio Agent 的能力入口与安全边界。</div></div><button class="btn" data-action="enter-studio">进入 Studio</button></div>
        <div class="setting-tabs"><button class="setting-tab ${tab === "models" ? "active" : ""}" data-setting-tab="models">模型</button><button class="setting-tab ${tab === "agent" ? "active" : ""}" data-setting-tab="agent">Agent</button><button class="setting-tab ${tab === "skills" ? "active" : ""}" data-setting-tab="skills">Skills</button><button class="setting-tab ${tab === "mcp" ? "active" : ""}" data-setting-tab="mcp">MCP</button></div>${settingsPanel(tab)}`;
    }

    function settingsPanel(tab) {
      if (tab === "models") return `<div class="settings-grid"><div class="setting-card"><div class="section-head"><div><h3>模型配置</h3><p>只有“已启用”且“Agent 可用”的模型会出现在 Composer。</p></div><button class="btn btn-primary btn-sm">＋ 添加模型</button></div>
        <div class="setting-row"><div><strong>Claude 4 Sonnet</strong><div class="muted" style="font-size:11px">Anthropic Messages</div></div><span class="badge"><span class="dot done"></span>可用</span><span class="muted">文本 · 图像理解 · 思考</span><button class="switch" title="Agent 可用"></button></div>
        <div class="setting-row"><div><strong>GPT-5.1</strong><div class="muted" style="font-size:11px">OpenAI Responses</div></div><span class="badge"><span class="dot done"></span>可用</span><span class="muted">文本 · 工具调用 · 思考</span><button class="switch"></button></div>
        <div class="setting-row"><div><strong>本地 Qwen3</strong><div class="muted" style="font-size:11px">Chat Completions 兼容</div></div><span class="badge badge-warn"><span class="dot warn"></span>未验证</span><span class="muted">文本 · 工具调用</span><button class="switch"></button></div></div></div>`;
      if (tab === "agent") return `<div class="settings-grid"><div class="setting-card"><h3>Agent 指令</h3><p>Pixoma 运行契约由系统维护；这里只编辑业务侧行为约束。</p><label class="form-label">管理员指令</label><textarea class="textarea">优先复用 Session 已有资产。执行会产生外部影响的工具前，遵循当前批准模式。生成资产时使用清晰、可搜索的名称。</textarea><label class="form-label">思考展示</label><select class="field"><option>默认折叠</option><option>默认展开</option><option>隐藏</option></select></div><div class="setting-card"><h3>资源保护</h3><p>单次最多 30 步 · 最长运行 30 分钟 · 每位用户并发 2 个 Run</p></div></div>`;
      if (tab === "skills") return `<div class="settings-grid"><div class="setting-card"><div class="section-head"><div><h3>Skills</h3><p>轻量声明式能力：SKILL.md + references / assets。不执行脚本。</p></div><button class="btn btn-primary btn-sm">＋ 创建 Skill</button></div><div class="setting-row"><div><strong>漫画编剧</strong><div class="muted" style="font-size:11px">v3 · 角色、节奏与对白方法</div></div><span class="badge"><span class="dot done"></span>已启用</span><span class="muted">SKILL.md</span><button class="switch"></button></div><div class="setting-row"><div><strong>品牌视觉规范</strong><div class="muted" style="font-size:11px">v1 · 品牌色与构图约束</div></div><span class="badge"><span class="dot done"></span>已启用</span><span class="muted">2 个 references</span><button class="switch"></button></div></div></div>`;
      return `<div class="settings-grid"><div class="setting-card"><div class="section-head"><div><h3>MCP 连接器</h3><p>本期支持 Streamable HTTP，凭证由系统统一管理。</p></div><button class="btn btn-primary btn-sm">＋ 添加连接器</button></div><div class="setting-row"><div><strong>Notion Workspace</strong><div class="muted" style="font-size:11px">https://mcp.example.com/notion</div></div><span class="badge"><span class="dot done"></span>健康</span><span class="muted">7 Tools · 3 Resources</span><button class="switch"></button></div><div class="setting-row"><div><strong>素材检索服务</strong><div class="muted" style="font-size:11px">Streamable HTTP</div></div><span class="badge badge-warn"><span class="dot warn"></span>需检查</span><span class="muted">2 Tools · 1 Resource</span><button class="switch"></button></div></div></div>`;
    }

    function openNode(nodeId) {
      const stage = state.stages.find(s => s.nodes.some(n => n.id === nodeId)); const node = stage.nodes.find(n => n.id === nodeId); state.selectedNode = nodeId;
      const drawer = document.getElementById("detailDrawer"); drawer.classList.remove("hidden"); document.getElementById("traceDrawer").classList.add("hidden");
      drawer.innerHTML = `<div class="drawer-head"><strong class="grow">${escapeHTML(node.name)}</strong><button class="btn btn-ghost btn-icon" data-action="close-drawers">×</button></div><div class="drawer-body"><span class="badge badge-brand">${escapeHTML(node.type)}</span><div class="kv"><span class="muted">所属阶段</span><strong>${escapeHTML(stage.title)}</strong></div><div class="kv"><span class="muted">状态</span><span>${escapeHTML(node.meta)}</span></div><div class="kv"><span class="muted">上下文</span><span>故事设定.md · 固定 v1</span></div><div class="code-box">节点是 Session Road 的可编辑视图。\n运行事实请查看独立 Trace；移动或删除该节点不会改写历史事件。</div><div class="row gap-8" style="margin-top:14px"><button class="btn btn-sm" data-action="open-trace">查看 Trace</button><button class="btn btn-sm btn-danger" data-action="remove-node" data-node="${node.id}">从 Road 移除</button></div></div>`;
      renderFlow();
    }

    function openAsset(assetId) {
      const asset = state.assets.find(a => a.id === assetId) || state.libraryAssets.find(a => a.id === assetId); if (!asset) return;
      const drawer = document.getElementById("detailDrawer"); drawer.classList.remove("hidden"); document.getElementById("traceDrawer").classList.add("hidden");
      drawer.innerHTML = `<div class="drawer-head"><strong class="grow">资产详情</strong><button class="btn btn-ghost btn-icon" data-action="close-drawers">×</button></div><div class="drawer-body"><div class="asset-preview">${asset.type === "图片" ? "图片预览" : `<span class="file-mark">MD</span>`}</div><h3>${escapeHTML(asset.name)}</h3><div class="kv"><span class="muted">类型</span><span>${escapeHTML(asset.type)}</span></div><div class="kv"><span class="muted">来源</span><span>${escapeHTML(asset.source)}</span></div><div class="kv"><span class="muted">版本</span><span>v${asset.version || 1} · 不可变版本</span></div><div class="row gap-8" style="margin-top:14px">${asset.saved ? `<span class="badge"><span class="dot done"></span>已在资产库</span>` : `<button class="btn btn-primary btn-sm" data-action="save-library" data-asset="${asset.id}">保存到资产库</button>`}</div></div>`;
    }

    function openTrace() {
      const drawer = document.getElementById("traceDrawer"); drawer.classList.remove("hidden"); document.getElementById("detailDrawer").classList.add("hidden");
      drawer.innerHTML = `<div class="drawer-head"><strong class="grow">Run Trace</strong><span class="badge">run_01J8…</span><button class="btn btn-ghost btn-icon" data-action="close-drawers">×</button></div><div class="drawer-body"><div class="muted" style="font-size:11px;margin-bottom:16px">不可变执行记录 · 用于排查、审计与恢复</div><div class="trace-item"><div class="trace-title">用户消息已提交</div><div class="trace-meta">09:42:03 · seq 001</div></div><div class="trace-item"><div class="trace-title">上下文已编译</div><div class="trace-meta">4 个资产索引 · 2 个内容片段</div></div><div class="trace-item"><div class="trace-title">Claude 4 Sonnet 完成计划</div><div class="trace-meta">3.2s · 1,284 tokens</div></div><div class="trace-item"><div class="trace-title">创建 AssetVersion</div><div class="trace-meta">雨夜来客·故事设定.md · v1</div></div><div class="trace-item"><div class="trace-title">等待用户批准</div><div class="trace-meta">generate_image · interrupt_04</div></div><div class="code-box">Trace 与资产 Road 分离：\nTrace 记录“实际发生了什么”；\nRoad 表达“用户如何组织这次创作”。</div></div>`;
    }

    function startRun() {
      state.run = { status: "running", progress: 32 }; render(); toast("已批准，任务会在后台继续运行");
      continueRun();
    }

    function continueRun() {
      clearInterval(runTimer); runTimer = setInterval(() => {
        state.run.progress = Math.min(100, state.run.progress + 8); renderRun(); saveState();
        if (state.run.progress >= 100) {
          clearInterval(runTimer); state.run.status = "done";
          if (!state.messages.some(m => m.done)) state.messages.push({ role: "assistant", text: "角色三视图和第一章六格分镜已经生成。我保留了每个输入资产的固定版本，结果也已加入右侧资产 Road。", done: true });
          render(); toast("创作任务已完成，生成 4 个 Session 资产");
        }
      }, 1200);
    }

    document.addEventListener("click", event => {
      const actionEl = event.target.closest("[data-action]");
      const tabEl = event.target.closest("[data-tab]");
      const settingTab = event.target.closest("[data-setting-tab]");
      const sessionEl = event.target.closest("[data-session]");
      const nodeEl = event.target.closest("[data-node]");
      const folderEl = event.target.closest("[data-folder]");
      const libraryAssetEl = event.target.closest("[data-library-asset]");
      const switchEl = event.target.closest(".switch");
      if (switchEl) { switchEl.classList.toggle("off"); toast(switchEl.classList.contains("off") ? "已停用" : "已启用"); return; }
      if (tabEl) { state.activeTab = tabEl.dataset.tab; render(); return; }
      if (settingTab) { state.settingsTab = settingTab.dataset.settingTab; render(); return; }
      if (sessionEl) { state.sessions.forEach(s => s.active = s.id === sessionEl.dataset.session); state.view = "session"; render(); return; }
      if (nodeEl && !actionEl) { openNode(nodeEl.dataset.node); return; }
      if (folderEl) { state.activeFolder = folderEl.dataset.folder; renderLibrary(); saveState(); return; }
      if (libraryAssetEl) { toast("已打开资产详情，可从关联对话继续创作"); return; }
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      if (action === "back-admin") { state.view = "admin"; render(); }
      if (action === "enter-studio" || action === "back-session") { state.view = "session"; render(); }
      if (action === "show-library") { state.view = "library"; render(); }
      if (action === "open-settings") { state.view = "settings"; state.settingsTab ||= "models"; render(); }
      if (action === "new-session") { state.messages = []; state.sessions.forEach(s => s.active = false); state.sessions.unshift({ id: `new-${Date.now()}`, title: "新对话", status: "已保存", active: true }); state.run = { status: "idle", progress: 0 }; state.view = "session"; render(); }
      if (action === "send") sendMessage();
      if (action === "approve") startRun();
      if (action === "reject") { state.run.status = "idle"; state.messages.push({ role: "assistant", text: "已取消本次生图调用。现有故事资产和 Road 不受影响，你可以调整角色设定后再继续。" }); render(); toast("已拒绝工具调用"); }
      if (action === "open-trace") openTrace();
      if (action === "close-drawers") { document.getElementById("detailDrawer").classList.add("hidden"); document.getElementById("traceDrawer").classList.add("hidden"); state.selectedNode = null; renderFlow(); }
      if (action === "open-asset") openAsset(actionEl.dataset.asset);
      if (action === "save-library") saveToLibrary(actionEl.dataset.asset);
      if (action === "create-asset") document.getElementById("assetDialog").showModal();
      if (action === "close-asset-dialog") document.getElementById("assetDialog").close();
      if (action === "confirm-create-asset") createAsset();
      if (action === "new-folder") { const name = prompt("文件夹名称"); if (name && !state.folders.includes(name)) { state.folders.push(name); state.activeFolder = name; render(); toast("文件夹已创建"); } }
      if (action === "add-stage") { state.stages.push({ id: `s${Date.now()}`, title: "新阶段", desc: "点击节点查看并继续整理", nodes: [] }); render(); toast("已添加阶段"); }
      if (action === "add-node") { const stage = state.stages[0]; stage.nodes.push({ id: `n${Date.now()}`, type: "计划", name: "新的创作步骤", meta: "用户添加" }); render(); toast("已添加计划节点"); }
      if (action === "remove-node") removeNode(actionEl.dataset.node);
      if (action === "attach-asset") { state.activeTab = "assets"; render(); toast("从 Session 资产或资产库选择输入"); }
      if (action === "pick-skill") toast("已加载 Skill：漫画编剧 v3");
      if (action === "mobile-workbench") document.getElementById("workbench").classList.toggle("mobile-hidden");
    });

    function sendMessage() {
      const input = document.getElementById("composerInput"); const text = input.value.trim(); if (!text) return;
      state.messages.push({ role: "user", text }); input.value = "";
      const current = state.sessions.find(s => s.active); if (current && current.title === "新对话") { current.title = text.slice(0, 16) + (text.length > 16 ? "…" : ""); document.getElementById("sessionTitle").textContent = current.title; }
      state.run = { status: "running", progress: 8 }; render();
      setTimeout(() => {
        state.messages.push({ role: "assistant", text: `我已理解你的要求，并把“${text.slice(0, 18)}${text.length > 18 ? "…" : ""}”加入当前计划。接下来会优先复用现有资产，再决定是否调用工作流。`, reasoning: "正在匹配可用模型、Skill、工作流和 MCP 工具，并检查当前批准模式。" });
        if (state.permission === "full") startRun();
        else if (state.permission === "review") { state.messages.push({ role: "assistant", text: "审核模型已检查本次调用范围与参数，未发现越权或高风险操作，已代你批准继续执行。" }); startRun(); }
        else { state.run.status = "idle"; render(); }
      }, 700);
    }

    function createAsset() {
      const name = document.getElementById("newAssetName").value.trim() || "未命名资产.md"; const id = `a${Date.now()}`;
      const asset = { id, name, type: "Markdown", source: "用户创建", version: 1, saved: document.getElementById("saveNewAsset").checked };
      state.assets.unshift(asset); state.stages[0].nodes.push({ id: `n${Date.now()}`, type: "资产", name, meta: "v1 · 用户创建" });
      if (asset.saved) state.libraryAssets.unshift({ id: `l${Date.now()}`, name, type: "Markdown", source: "用户创建", folder: state.activeFolder === "全部资产" ? "漫画项目" : state.activeFolder });
      document.getElementById("assetDialog").close(); state.activeTab = "assets"; render(); toast("资产已创建并加入当前 Session");
    }

    function saveToLibrary(assetId) {
      const asset = state.assets.find(a => a.id === assetId); if (!asset || asset.saved) return;
      asset.saved = true; state.libraryAssets.unshift({ id: `l${Date.now()}`, name: asset.name, type: asset.type, source: "雨夜侦探漫画分镜创作", folder: "漫画项目" });
      render(); openAsset(assetId); toast("已保存到资产库；底层复用同一 AssetVersion");
    }

    function removeNode(nodeId) {
      if (!confirm("只从资产 Road 移除这个节点？对应资产和 Trace 会保留。")) return;
      state.stages.forEach(s => s.nodes = s.nodes.filter(n => n.id !== nodeId)); state.selectedNode = null; document.getElementById("detailDrawer").classList.add("hidden"); render(); toast("节点已从 Road 移除，资产与 Trace 未删除");
    }

    document.getElementById("modelSelect").addEventListener("change", e => { state.model = e.target.value; saveState(); toast(`已切换模型：${state.model}`); });
    document.getElementById("permissionSelect").addEventListener("change", e => { state.permission = e.target.value; saveState(); const labels = { ask: "请求批准", review: "帮我批准", full: "完全访问" }; toast(`权限模式：${labels[state.permission]}`); });
    document.getElementById("sessionSearch").addEventListener("input", renderSessions);
    document.getElementById("assetSearch").addEventListener("input", renderLibrary);
    document.getElementById("composerInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

    render();
    if (state.run.status === "running") continueRun();
  </script>
</body>
</html>
