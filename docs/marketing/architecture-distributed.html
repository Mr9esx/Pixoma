<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixoma · Distributed 部署</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .header h1 { font-size: 1.25rem; font-weight: 700; }
    .pulse-dot { width: 10px; height: 10px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; box-shadow: 0 0 12px #22d3ee; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .subtitle { color: #94a3b8; font-size: 0.85rem; }
    .badges { display: flex; gap: 0.4rem; margin-top: 0.75rem; flex-wrap: wrap; }
    .badge { font-size: 0.7rem; padding: 0.2rem 0.55rem; border-radius: 999px; border: 1px solid #1e293b; color: #94a3b8; background: rgba(15, 23, 42, 0.6); }
    .badge.cyan { color: #22d3ee; border-color: rgba(34, 211, 238, 0.4); }
    .badge.green { color: #34d399; border-color: rgba(52, 211, 153, 0.4); }
    .badge.amber { color: #fbbf24; border-color: rgba(251, 191, 36, 0.4); }
    .badge.violet { color: #a78bfa; border-color: rgba(167, 139, 250, 0.4); }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; }
    svg { width: 100%; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
    .toolbar { display: flex; gap: 0.5rem; margin-left: auto; flex-shrink: 0; align-items: center; }
    .toolbar-toggle { background: transparent; border: none; color: #475569; cursor: pointer; font-size: 1.25rem; line-height: 1; padding: 0.25rem 0.5rem; border-radius: 0.375rem; transition: color 0.2s, background 0.2s; }
    .toolbar-toggle:hover { color: #94a3b8; background: rgba(30, 41, 59, 0.5); }
    .toolbar-actions { display: none; gap: 0.5rem; }
    .toolbar.expanded .toolbar-actions { display: flex; }
    .toolbar-actions button { background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; color: #94a3b8; padding: 0.375rem 0.75rem; border-radius: 0.375rem; font-family: inherit; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .toolbar-actions button:hover { background: rgba(51, 65, 85, 0.8); color: white; border-color: #475569; }
    @media print { body { background: #020617; padding: 1rem; } .toolbar { display: none !important; } }
  </style>
</head>
<body>
  <div class="container" id="report-container">
    <div class="header">
      <div class="pulse-dot"></div>
      <h1>Pixoma · Distributed</h1>
      <div class="toolbar">
        <div class="toolbar-actions">
          <button onclick="copyAsImage(this)">📋 Copy</button>
          <button onclick="downloadPNG(this)">🖼️ PNG</button>
          <button onclick="downloadPDF(this)">📄 PDF</button>
        </div>
        <button class="toolbar-toggle" onclick="this.parentElement.classList.toggle('expanded')" title="Export options" aria-label="Export options">⋯</button>
      </div>
    </div>
    <p class="subtitle">控制面与执行面分离，任意扩展 GPU 节点</p>
    <div class="badges">
      <span class="badge cyan">↗ Edge 主动出站</span>
      <span class="badge green">✓ PostgreSQL / MySQL</span>
      <span class="badge amber">📦 S3 / TOS / MinIO</span>
      <span class="badge violet">♾ N 个 GPU 节点</span>
    </div>

    <div class="diagram-container" style="margin-top:1.5rem;">
      <svg viewBox="0 0 1100 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
          <marker id="arrowhead-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
          <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- ============ Arrows (drawn first) ============ -->
        <!-- User -> Control Plane -->
        <line x1="220" y1="240" x2="340" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="280" y="230" fill="#94a3b8" font-size="10" text-anchor="middle">Telegram</text>
        <!-- Control Plane -> Cloud (up) -->
        <line x1="500" y1="160" x2="500" y2="100" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowhead-amber)"/>
        <!-- Control Plane -> DB (down) -->
        <line x1="500" y1="320" x2="500" y2="380" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowhead)"/>
        <!-- Claim bus: vertical line from edges to control plane -->
        <line x1="700" y1="100" x2="700" y2="380" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,3" opacity="0.6"/>
        <!-- Bus -> Agent API -->
        <line x1="700" y1="240" x2="660" y2="240" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-cyan)"/>
        <!-- Each edge -> bus -->
        <line x1="760" y1="130" x2="700" y2="130" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowhead-cyan)"/>
        <line x1="760" y1="220" x2="700" y2="220" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowhead-cyan)"/>
        <line x1="760" y1="310" x2="700" y2="310" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowhead-cyan)"/>

        <!-- ============ LEFT: User ============ -->
        <g transform="translate(60, 190)">
          <rect x="0" y="0" width="140" height="100" rx="50" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
          <path d="M 40 25 Q 40 15 50 15 L 90 15 Q 100 15 100 25 L 100 50 Q 100 60 90 60 L 60 60 L 50 70 L 50 60 L 50 60 Q 40 60 40 50 Z" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
          <circle cx="55" cy="38" r="2" fill="#94a3b8"/>
          <circle cx="70" cy="38" r="2" fill="#94a3b8"/>
          <circle cx="85" cy="38" r="2" fill="#94a3b8"/>

        </g>

        <!-- ============ CENTER: Control Plane ============ -->
        <rect x="340" y="160" width="320" height="160" rx="20" fill="rgba(251, 191, 36, 0.05)" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="500" y="188" fill="#fbbf24" font-size="18" font-weight="700" text-anchor="middle">控制面</text>
        <text x="500" y="205" fill="#fbbf24" font-size="9" text-anchor="middle" opacity="0.8">Pixoma Control Plane</text>

        <!-- 3 simple sub-icons inside -->
        <g transform="translate(370, 230)">
          <rect x="0" y="0" width="80" height="70" rx="10" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
          <text x="40" y="32" fill="white" font-size="11" font-weight="600" text-anchor="middle">Bot</text>
          <text x="40" y="50" fill="#94a3b8" font-size="8" text-anchor="middle">适配</text>
        </g>
        <g transform="translate(465, 225)">
          <rect x="0" y="0" width="80" height="80" rx="10" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="2"/>
          <text x="40" y="36" fill="white" font-size="11" font-weight="700" text-anchor="middle">调度</text>
          <text x="40" y="54" fill="#34d399" font-size="9" text-anchor="middle" font-weight="600">★</text>
          <text x="40" y="68" fill="#94a3b8" font-size="7" text-anchor="middle">API + 后台</text>
        </g>
        <g transform="translate(560, 230)">
          <rect x="0" y="0" width="80" height="70" rx="10" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
          <text x="40" y="32" fill="white" font-size="11" font-weight="600" text-anchor="middle">后台</text>
          <text x="40" y="50" fill="#94a3b8" font-size="8" text-anchor="middle">:8080</text>
        </g>

        <!-- ============ TOP: Cloud (S3/TOS) ============ -->
        <g transform="translate(450, 30)">
          <!-- Cloud icon -->
          <path d="M 25 50 Q 10 50 10 38 Q 10 28 22 26 Q 25 12 42 12 Q 58 12 62 26 Q 80 26 80 40 Q 80 52 65 52 L 25 52 Z" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="50" y="78" fill="white" font-size="12" font-weight="600" text-anchor="middle">S3 / TOS</text>
          <text x="50" y="92" fill="#fbbf24" font-size="9" text-anchor="middle">对象存储</text>
        </g>

        <!-- ============ BOTTOM: Database (PostgreSQL) ============ -->
        <g transform="translate(450, 400)">
          <ellipse cx="50" cy="10" rx="35" ry="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
          <path d="M 15 10 L 15 50 Q 15 58 50 58 Q 85 58 85 50 L 85 10" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
          <ellipse cx="50" cy="30" rx="35" ry="8" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
          <text x="50" y="80" fill="white" font-size="12" font-weight="600" text-anchor="middle">PostgreSQL</text>
        </g>

        <!-- ============ RIGHT: Edge GPU nodes (a grid showing scale) ============ -->
        <!-- Big dashed boundary: GPU 集群 -->
        <rect x="770" y="40" width="290" height="400" rx="16" fill="rgba(30, 41, 59, 0.2)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="915" y="62" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">GPU 节点集群</text>

        <!-- 3x2 grid of GPU nodes -->
        <g>
          <!-- Node 1 -->
          <g transform="translate(800, 85)">
            <rect x="0" y="0" width="80" height="80" rx="10" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1.5"/>
            <rect x="25" y="20" width="30" height="22" rx="2" fill="none" stroke="#34d399" stroke-width="1.2"/>
            <rect x="32" y="27" width="16" height="8" fill="#34d399" opacity="0.5"/>
            <text x="40" y="60" fill="white" font-size="10" font-weight="600" text-anchor="middle">Edge 01</text>
            <text x="40" y="72" fill="#94a3b8" font-size="8" text-anchor="middle">A100</text>
          </g>
          <!-- Node 2 -->
          <g transform="translate(900, 85)">
            <rect x="0" y="0" width="80" height="80" rx="10" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1.5"/>
            <rect x="25" y="20" width="30" height="22" rx="2" fill="none" stroke="#34d399" stroke-width="1.2"/>
            <rect x="32" y="27" width="16" height="8" fill="#34d399" opacity="0.5"/>
            <text x="40" y="60" fill="white" font-size="10" font-weight="600" text-anchor="middle">Edge 02</text>
            <text x="40" y="72" fill="#94a3b8" font-size="8" text-anchor="middle">H100</text>
          </g>
          <!-- Node 3 -->
          <g transform="translate(800, 180)">
            <rect x="0" y="0" width="80" height="80" rx="10" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1.5"/>
            <rect x="25" y="20" width="30" height="22" rx="2" fill="none" stroke="#34d399" stroke-width="1.2"/>
            <rect x="32" y="27" width="16" height="8" fill="#34d399" opacity="0.5"/>
            <text x="40" y="60" fill="white" font-size="10" font-weight="600" text-anchor="middle">Edge 03</text>
            <text x="40" y="72" fill="#94a3b8" font-size="8" text-anchor="middle">A100</text>
          </g>
          <!-- Node 4 -->
          <g transform="translate(900, 180)">
            <rect x="0" y="0" width="80" height="80" rx="10" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1.5"/>
            <rect x="25" y="20" width="30" height="22" rx="2" fill="none" stroke="#34d399" stroke-width="1.2"/>
            <rect x="32" y="27" width="16" height="8" fill="#34d399" opacity="0.5"/>
            <text x="40" y="60" fill="white" font-size="10" font-weight="600" text-anchor="middle">Edge 04</text>
            <text x="40" y="72" fill="#94a3b8" font-size="8" text-anchor="middle">4090</text>
          </g>
          <!-- Node 5 -->
          <g transform="translate(800, 275)">
            <rect x="0" y="0" width="80" height="80" rx="10" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1.5"/>
            <rect x="25" y="20" width="30" height="22" rx="2" fill="none" stroke="#34d399" stroke-width="1.2"/>
            <rect x="32" y="27" width="16" height="8" fill="#34d399" opacity="0.5"/>
            <text x="40" y="60" fill="white" font-size="10" font-weight="600" text-anchor="middle">Edge 05</text>
            <text x="40" y="72" fill="#94a3b8" font-size="8" text-anchor="middle">L40S</text>
          </g>
          <!-- Node 6 ("+ N more") -->
          <g transform="translate(900, 275)">
            <rect x="0" y="0" width="80" height="80" rx="10" fill="rgba(30, 41, 59, 0.3)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
            <text x="40" y="42" fill="#22d3ee" font-size="22" font-weight="700" text-anchor="middle">···</text>
            <text x="40" y="60" fill="#94a3b8" font-size="9" text-anchor="middle">N 更多</text>
            <text x="40" y="72" fill="#94a3b8" font-size="7" text-anchor="middle">任意扩展</text>
          </g>
        </g>

        <!-- "任意扩展" big text below grid -->
        <text x="915" y="395" fill="#22d3ee" font-size="14" font-weight="700" text-anchor="middle">♾ 水平无上限</text>
        <text x="915" y="415" fill="#94a3b8" font-size="9" text-anchor="middle">每节点自带 ComfyUI · Topic 路由分发</text>

        <!-- ============ Side labels ============ -->
        <text x="40" y="180" fill="#94a3b8" font-size="9" opacity="0.6">对话入口</text>
        <text x="40" y="478" fill="#22d3ee" font-size="10" font-weight="600">↗ Edge 主动出站</text>
        <text x="40" y="492" fill="#94a3b8" font-size="8" opacity="0.7">GPU 机器无需公网 IP</text>

        <!-- Bus label -->
        <rect x="675" y="225" width="50" height="20" rx="4" fill="rgba(8, 51, 68, 0.9)" stroke="#22d3ee" stroke-width="1"/>
        <text x="700" y="239" fill="#22d3ee" font-size="8" font-weight="600" text-anchor="middle">Claim</text>
      </svg>
    </div>

    <p class="footer">Pixoma · Distributed 部署 · 控制面轻量 + Edge 横向扩展 · 与 All-in-One 共享同一份二进制与领域模型</p>
  </div>

  <script>
    async function copyAsImage(btn) {
      const orig = btn.textContent;
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        btn.textContent = '✓ Copied!';
      } catch (e) { btn.textContent = '✗ Failed'; }
      setTimeout(() => btn.textContent = orig, 2000);
    }
    async function downloadPNG(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const link = document.createElement('a');
        link.download = 'pixoma-architecture-distributed.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.textContent = '✓ Done!';
      } catch (e) { btn.textContent = '✗ Failed'; }
      setTimeout(() => btn.textContent = orig, 2000);
    }
    async function downloadPDF(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const orientation = canvas.width > canvas.height ? 'landscape' : 'portrait';
        const pdf = new jsPDF({ orientation, unit: 'px', format: [canvas.width, canvas.height], hotfixes: ['px_scaling'] });
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save('pixoma-architecture-distributed.pdf');
        btn.textContent = '✓ Done!';
      } catch (e) { btn.textContent = '✗ Failed'; }
      setTimeout(() => btn.textContent = orig, 2000);
    }
  </script>
</body>
</html>
