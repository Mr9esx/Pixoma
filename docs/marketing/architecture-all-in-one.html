<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixoma · All-in-One 部署</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .header h1 { font-size: 1.25rem; font-weight: 700; }
    .pulse-dot { width: 10px; height: 10px; background: #34d399; border-radius: 50%; animation: pulse 2s infinite; box-shadow: 0 0 12px #34d399; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .subtitle { color: #94a3b8; font-size: 0.85rem; }
    .badges { display: flex; gap: 0.4rem; margin-top: 0.75rem; flex-wrap: wrap; }
    .badge { font-size: 0.7rem; padding: 0.2rem 0.55rem; border-radius: 999px; border: 1px solid #1e293b; color: #94a3b8; background: rgba(15, 23, 42, 0.6); }
    .badge.green { color: #34d399; border-color: rgba(52, 211, 153, 0.4); }
    .badge.cyan { color: #22d3ee; border-color: rgba(34, 211, 238, 0.4); }
    .badge.amber { color: #fbbf24; border-color: rgba(251, 191, 36, 0.4); }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; }
    svg { width: 100%; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
    .toolbar { display: flex; gap: 0.5rem; margin-left: auto; flex-shrink: 0; align-items: center; }
    .toolbar-toggle { background: transparent; border: none; color: #475569; cursor: pointer; font-size: 1.25rem; line-height: 1; padding: 0.25rem 0.5rem; border-radius: 0.375rem; transition: color 0.2s, background 0.2s; }
    .toolbar-toggle:hover { color: #94a3b8; background: rgba(30, 41, 59, 0.5); }
    .toolbar-actions { display: none; gap: 0.5rem; }
    .toolbar.expanded .toolbar-actions { display: flex; }
    .toolbar-actions button { background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; color: #94a3b8; padding: 0.375rem 0.75rem; border-radius: 0.375rem; font-family: inherit; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .toolbar-actions button:hover { background: rgba(51, 65, 85, 0.8); color: white; border-color: #475569; }
    @media print { body { background: #020617; padding: 1rem; } .toolbar { display: none !important; } }
  </style>
</head>
<body>
  <div class="container" id="report-container">
    <div class="header">
      <div class="pulse-dot"></div>
      <h1>Pixoma · All-in-One</h1>
      <div class="toolbar">
        <div class="toolbar-actions">
          <button onclick="copyAsImage(this)">📋 Copy</button>
          <button onclick="downloadPNG(this)">🖼️ PNG</button>
          <button onclick="downloadPDF(this)">📄 PDF</button>
        </div>
        <button class="toolbar-toggle" onclick="this.parentElement.classList.toggle('expanded')" title="Export options" aria-label="Export options">⋯</button>
      </div>
    </div>
    <p class="subtitle">一个二进制，零外部基础设施</p>
    <div class="badges">
      <span class="badge green">✓ 零 Redis</span>
      <span class="badge green">✓ 零 MQ</span>
      <span class="badge green">✓ 零外部 DB</span>
      <span class="badge cyan">📦 单二进制 ~30MB</span>
      <span class="badge amber">🧊 SQLite + LocalFS</span>
    </div>

    <div class="diagram-container" style="margin-top:1.5rem;">
      <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
          <marker id="arrowhead-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
          <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- ============ Arrows (drawn first) ============ -->
        <!-- User -> Pixoma -->
        <line x1="200" y1="200" x2="320" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="260" y="190" fill="#94a3b8" font-size="10" text-anchor="middle">Telegram</text>
        <!-- Pixoma -> ComfyUI -->
        <line x1="720" y1="200" x2="840" y2="200" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>
        <text x="780" y="190" fill="#fbbf24" font-size="10" text-anchor="middle">HTTP</text>
        <!-- Pixoma -> Local storage (down) -->
        <line x1="520" y1="330" x2="520" y2="380" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowhead)"/>

        <!-- ============ LEFT: User (chat bubble icon) ============ -->
        <g transform="translate(60, 150)">
          <rect x="0" y="0" width="140" height="100" rx="50" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
          <!-- Chat bubble icon -->
          <path d="M 40 25 Q 40 15 50 15 L 90 15 Q 100 15 100 25 L 100 50 Q 100 60 90 60 L 60 60 L 50 70 L 50 60 L 50 60 Q 40 60 40 50 Z" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
          <circle cx="55" cy="38" r="2" fill="#94a3b8"/>
          <circle cx="70" cy="38" r="2" fill="#94a3b8"/>
          <circle cx="85" cy="38" r="2" fill="#94a3b8"/>
          <text x="70" y="93" fill="white" font-size="12" font-weight="600" text-anchor="middle">用户</text>
        </g>

        <!-- ============ CENTER: ONE BIG PIXOMA BOX ============ -->
        <rect x="320" y="80" width="400" height="250" rx="20" fill="rgba(52, 211, 153, 0.06)" stroke="#34d399" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="520" y="110" fill="#34d399" font-size="20" font-weight="700" text-anchor="middle">Pixoma</text>
        <text x="520" y="130" fill="#34d399" font-size="10" text-anchor="middle" opacity="0.8">单进程 · all-in-one</text>

        <!-- 3 simple sub-icons inside -->
        <g transform="translate(370, 165)">
          <circle cx="40" cy="40" r="32" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
          <text x="40" y="36" fill="white" font-size="11" font-weight="600" text-anchor="middle">Bot</text>
          <text x="40" y="50" fill="#94a3b8" font-size="8" text-anchor="middle">适配</text>
        </g>
        <g transform="translate(460, 165)">
          <circle cx="40" cy="40" r="36" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="2"/>
          <text x="40" y="36" fill="white" font-size="11" font-weight="700" text-anchor="middle">调度</text>
          <text x="40" y="50" fill="#34d399" font-size="8" text-anchor="middle" font-weight="600">★</text>
        </g>
        <g transform="translate(550, 165)">
          <circle cx="40" cy="40" r="32" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
          <text x="40" y="36" fill="white" font-size="11" font-weight="600" text-anchor="middle">执行</text>
          <text x="40" y="50" fill="#94a3b8" font-size="8" text-anchor="middle">Comfy</text>
        </g>
        <g transform="translate(640, 165)">
          <circle cx="40" cy="40" r="32" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
          <text x="40" y="36" fill="white" font-size="11" font-weight="600" text-anchor="middle">后台</text>
          <text x="40" y="50" fill="#94a3b8" font-size="8" text-anchor="middle">:8080</text>
        </g>

        <!-- Tiny dots connecting sub-icons -->
        <line x1="442" y1="205" x2="460" y2="205" stroke="#34d399" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="540" y1="205" x2="550" y2="205" stroke="#34d399" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="630" y1="205" x2="640" y2="205" stroke="#34d399" stroke-width="1" stroke-dasharray="2,2"/>

        <!-- Memory Queue (inline pill) -->
        <rect x="400" y="280" width="240" height="30" rx="15" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1"/>
        <text x="520" y="300" fill="#fb923c" font-size="10" text-anchor="middle">内存事件总线 · 取代 Redis / NATS</text>

        <!-- ============ RIGHT: ComfyUI (GPU box) ============ -->
        <g transform="translate(840, 150)">
          <rect x="0" y="0" width="120" height="100" rx="14" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
          <!-- GPU chip icon -->
          <rect x="40" y="25" width="40" height="30" rx="3" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
          <rect x="50" y="35" width="20" height="10" fill="#fbbf24" opacity="0.5"/>
          <line x1="45" y1="25" x2="45" y2="20" stroke="#fbbf24" stroke-width="1.5"/>
          <line x1="55" y1="25" x2="55" y2="20" stroke="#fbbf24" stroke-width="1.5"/>
          <line x1="65" y1="25" x2="65" y2="20" stroke="#fbbf24" stroke-width="1.5"/>
          <line x1="75" y1="25" x2="75" y2="20" stroke="#fbbf24" stroke-width="1.5"/>
          <line x1="45" y1="55" x2="45" y2="60" stroke="#fbbf24" stroke-width="1.5"/>
          <line x1="55" y1="55" x2="55" y2="60" stroke="#fbbf24" stroke-width="1.5"/>
          <line x1="65" y1="55" x2="65" y2="60" stroke="#fbbf24" stroke-width="1.5"/>
          <line x1="75" y1="55" x2="75" y2="60" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="60" y="78" fill="white" font-size="12" font-weight="600" text-anchor="middle">ComfyUI</text>
          <text x="60" y="92" fill="#fbbf24" font-size="8" text-anchor="middle">同机 / 局域网</text>
        </g>

        <!-- ============ BOTTOM: Local storage strip ============ -->
        <g transform="translate(280, 380)">
          <rect x="0" y="0" width="480" height="50" rx="10" fill="rgba(76, 29, 149, 0.15)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,2"/>
          <!-- Disk icon -->
          <ellipse cx="25" cy="25" rx="12" ry="3" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
          <path d="M 13 25 L 13 32 Q 13 35 25 35 Q 37 35 37 32 L 37 25" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
          <line x1="13" y1="29" x2="37" y2="29" stroke="#a78bfa" stroke-width="0.5" opacity="0.5"/>
          <text x="60" y="22" fill="white" font-size="12" font-weight="600">本地存储</text>
          <text x="60" y="38" fill="#94a3b8" font-size="10">SQLite 业务库 + LocalFS Blob 产物</text>
        </g>

        <!-- ============ Side labels ============ -->
        <text x="40" y="120" fill="#94a3b8" font-size="9" text-anchor="start" opacity="0.6">对话入口</text>
        <text x="960" y="120" fill="#94a3b8" font-size="9" text-anchor="end" opacity="0.6">执行</text>
        <text x="520" y="450" fill="#a78bfa" font-size="9" text-anchor="middle" opacity="0.6">持久化</text>

        <!-- ============ One-liner callout (corner) ============ -->
        <g transform="translate(40, 420)">
          <text x="0" y="0" fill="#94a3b8" font-size="10" opacity="0.7">一条命令启动</text>
          <text x="0" y="18" fill="#34d399" font-size="11" font-weight="600" font-family="monospace">curl ... | sh &amp;&amp; pixoma</text>
        </g>
      </svg>
    </div>

    <p class="footer">Pixoma · All-in-One 部署 · 适合个人 / 小团队 / 私有化 PoC</p>
  </div>

  <script>
    async function copyAsImage(btn) {
      const orig = btn.textContent;
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        btn.textContent = '✓ Copied!';
      } catch (e) { btn.textContent = '✗ Failed'; }
      setTimeout(() => btn.textContent = orig, 2000);
    }
    async function downloadPNG(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const link = document.createElement('a');
        link.download = 'pixoma-architecture-all-in-one.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.textContent = '✓ Done!';
      } catch (e) { btn.textContent = '✗ Failed'; }
      setTimeout(() => btn.textContent = orig, 2000);
    }
    async function downloadPDF(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const orientation = canvas.width > canvas.height ? 'landscape' : 'portrait';
        const pdf = new jsPDF({ orientation, unit: 'px', format: [canvas.width, canvas.height], hotfixes: ['px_scaling'] });
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save('pixoma-architecture-all-in-one.pdf');
        btn.textContent = '✓ Done!';
      } catch (e) { btn.textContent = '✗ Failed'; }
      setTimeout(() => btn.textContent = orig, 2000);
    }
  </script>
</body>
</html>
