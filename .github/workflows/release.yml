name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Build admin UI
        run: |
          pnpm --dir web/admin install --frozen-lockfile
          pnpm --dir web/admin build
          rm -rf apps/pixoma/internal/webembed/dist
          cp -R web/admin/dist apps/pixoma/internal/webembed/dist
      - name: Package release
        run: scripts/package-release.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: pixoma-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release
          sha256sum pixoma_*.tar.gz > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_args=(create "$GITHUB_REF_NAME" release/*.tar.gz release/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes)
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) release_args+=(--prerelease) ;;
          esac
          gh "${release_args[@]}"
